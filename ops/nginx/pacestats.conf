# PaceStats nginx settings for the /stats application.
#
# REVIEW BEFORE USE. This repository cannot see the production nginx
# configuration; merge these directives into the existing server block rather
# than replacing it, then run `nginx -t` before reloading.
#
# What each part fixes (measured against the live site, November 2026):
#   - HTTP/2: the site answered over HTTP/1.1, so browsers fetched the 14-18
#     script files per page six at a time.
#   - gzip_types: nginx compresses only text/html by default. The application
#     sends everything uncompressed (compress: false in next.config.mjs) and
#     relies on nginx for gzip, or Brotli where the module is installed.
#   - proxy_cache: the app sends `s-maxage` on pages and API responses, but
#     nothing in front of it stored them, so every view was rendered again.

# --- http {} context -------------------------------------------------------

proxy_cache_path /var/cache/nginx/pacestats
                 levels=1:2
                 keys_zone=pacestats:20m
                 max_size=1g
                 inactive=30m
                 use_temp_path=off;

# --- server {} context -----------------------------------------------------

# nginx >= 1.25.1: `http2 on;`. On nginx 1.18 use the listen flag instead.
listen 443 ssl http2;
listen [::]:443 ssl http2;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    text/css
    text/plain
    text/x-component
    image/svg+xml;

location /stats/ {
    proxy_pass http://127.0.0.1:5050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # The app rate-limits on the first X-Forwarded-For entry. Replace the
    # header instead of appending to it, or clients can choose their own key.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Shared cache. nginx takes the lifetime from the app's Cache-Control
    # (`s-maxage`), skips responses marked private/no-store, and keys variants
    # on the app's Vary header (RSC navigations, Accept-Encoding).
    proxy_cache pacestats;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_methods GET HEAD;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_authorization $http_x_api_key;
    proxy_no_cache $http_authorization $http_x_api_key;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Build output is content-hashed; Next.js already marks it immutable.
location /stats/_next/static/ {
    proxy_pass http://127.0.0.1:5050;
    proxy_cache pacestats;
    proxy_cache_valid 200 30d;
}
